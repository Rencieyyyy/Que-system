<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABC Pickleyard – Live Display</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    /* ===== GREEN NAVBAR WITH LOGO ===== */
    .top-nav {
      background: linear-gradient(90deg, #5ac4ad, #4cb8a3);
      color: white;
      padding: 11px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .nav-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-logo-placeholder {
      color: #4cb8a3;
      font-size: 22px;
    }

    .top-nav-left h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
    }

    .top-nav-left p {
      font-size: 0.78rem;
      opacity: 0.92;
      margin: 1px 0 0;
    }

    .top-nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-clock {
      background: rgba(255,255,255,0.22);
      padding: 7px 16px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      backdrop-filter: blur(4px);
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.22);
      color: white;
      cursor: pointer;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .theme-btn:hover {
      background: rgba(255,255,255,0.35);
    }

    /* Main content */
    .display-wrapper {
      height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
      padding: 16px 22px 18px;
      max-width: 1400px;
      margin: 0 auto;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .display-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
      align-items: start; /* panels size to their own content, don't force-stretch each other */
    }

    .display-panel {
      background: var(--white);
      border-radius: 18px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* IN PLAY should still fill the full available height on its side */
    #inPlayPanel {
      height: 100%;
      align-self: stretch;
    }

    /* NEXT UP only takes as much height as its content needs */
    #nextUpPanel {
      align-self: start;
      max-height: 100%;
    }

    .display-panel h2 {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
    }

    .dot.live {
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.35);
      animation: pulse 1.5s infinite;
    }

    /* ===== IN PLAY ===== */
    #courtCard {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .court-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      letter-spacing: 0.3px;
    }

    .court-timer {
      font-size: 3.1rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--primary-dark);
      text-align: center;
      margin: 2px 0 16px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(76, 184, 163, 0.25);
    }

    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
    }

    .player-box {
      background: linear-gradient(145deg, var(--primary-light), rgba(90, 196, 173, 0.15));
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      font-weight: 700;
      font-size: 1.12rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-height: 88px;
      justify-content: center;
      border: 1px solid rgba(90, 196, 173, 0.25);
      transition: transform 0.2s;
    }

    .player-box:hover {
      transform: scale(1.02);
    }

    .player-box .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5ac4ad, #3da892);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(76, 184, 163, 0.4);
    }

    .vs-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--white);
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 0.95rem;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    /* ===== NEXT UP - compact, content-sized ===== */
    #nextGames {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: visible;
    }

    .next-game {
      background: linear-gradient(135deg, var(--primary-light), rgba(90, 196, 173, 0.12));
      border-radius: 12px;
      padding: 10px 14px 12px;
      border: 1px solid rgba(90, 196, 173, 0.2);
      margin-bottom: 0;
    }

    .g-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 3px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .g-list {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    /* --- Per-player mini boxes inside NEXT UP / LATER --- */
    .mini-match {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .mini-team {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .mini-vs {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--white);
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .mini-player {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      border: 1px solid rgba(90, 196, 173, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      min-width: 0;
    }

    .mini-player .mini-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5ac4ad, #3da892);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .mini-player .mini-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-players-flat {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .mini-players-flat .mini-player {
      flex: 0 0 auto;
    }

    /* Player of the Night */
    .potn-panel {
      margin-top: 14px;
      flex-shrink: 0;
    }

    #top3List {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-msg {
      text-align: center;
      padding: 28px 12px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* ===== Player of the Night — Medal Styling ===== */
    #top3List .list-row.top3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 15px;
      transition: transform 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    #top3List .list-row.top3:hover {
      transform: translateX(4px);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Rank badge base (becomes a medal circle) */
    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
      position: relative;
      font-size: 0; /* hide the number */
    }
    .rank-badge::before {
      font-size: 1.3rem;
    }

    /* 🥇 1st place */
    .rank-badge.r1 {
      background: linear-gradient(135deg, #ffd700, #e0a800);
      box-shadow: 0 3px 10px rgba(255, 200, 0, 0.5);
    }
    .rank-badge.r1::before { content: "🥇"; }

    /* 🥈 2nd place */
    .rank-badge.r2 {
      background: linear-gradient(135deg, #d7d7d7, #a8a8a8);
      box-shadow: 0 3px 10px rgba(160, 160, 160, 0.45);
    }
    .rank-badge.r2::before { content: "🥈"; }

    /* 🥉 3rd place */
    .rank-badge.r3 {
      background: linear-gradient(135deg, #cd7f32, #a05a1f);
      box-shadow: 0 3px 10px rgba(180, 110, 40, 0.45);
    }
    .rank-badge.r3::before { content: "🥉"; }

    /* Row backgrounds per rank */
    #top3List .list-row.top3:has(.rank-badge.r1) {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.14), rgba(255, 215, 0, 0.03));
      border: 1px solid rgba(255, 191, 0, 0.5);
      box-shadow: 0 4px 16px rgba(255, 191, 0, 0.18);
      transform: scale(1.02);
    }
    #top3List .list-row.top3:has(.rank-badge.r2) {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.16), rgba(192, 192, 192, 0.03));
      border: 1px solid rgba(170, 170, 170, 0.5);
    }
    #top3List .list-row.top3:has(.rank-badge.r3) {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.16), rgba(205, 127, 50, 0.03));
      border: 1px solid rgba(205, 127, 50, 0.5);
    }

    /* Name + wins polish */
    #top3List .name {
      font-size: 1.05rem;
      font-weight: 700;
    }
    #top3List .list-row.top3:has(.rank-badge.r1) .name { color: #a67c00; }
    #top3List .list-row.top3:has(.rank-badge.r2) .name { color: #6e6e6e; }
    #top3List .list-row.top3:has(.rank-badge.r3) .name { color: #8a4b1f; }

    #top3List .wins {
      font-size: 0.85rem;
      padding: 3px 11px;
      border-radius: 30px;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    #top3List .list-row.top3:has(.rank-badge.r1) .wins {
      background: rgba(255, 191, 0, 0.25);
      color: #8a6300;
    }
    #top3List .list-row.top3:has(.rank-badge.r2) .wins {
      background: rgba(192, 192, 192, 0.3);
      color: #5c5c5c;
    }
    #top3List .list-row.top3:has(.rank-badge.r3) .wins {
      background: rgba(205, 127, 50, 0.28);
      color: #7a4620;
    }

    /* Shine sweep on #1 only */
    #top3List .list-row.top3:has(.rank-badge.r1)::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.35) 50%, transparent 80%);
      background-size: 200% 100%;
      animation: shine 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Live panel top line */
    .display-panel.live-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      border-radius: 18px 18px 0 0;
    }

    @media (max-width: 950px) {
      .display-grid {
        grid-template-columns: 1fr;
      }
      .court-timer {
        font-size: 2.4rem;
      }
      #inPlayPanel {
        height: auto;
      }
    }
  </style>
</head>
<body>

  <!-- GREEN NAVBAR WITH LOGO -->
  <div class="top-nav">
    <div class="top-nav-left">
      <div class="nav-logo" id="displayLogo">
        <img id="logoImg" hidden alt="Logo" />
        <div id="logoPlaceholder" class="nav-logo-placeholder">
          <i class="fas fa-table-tennis-paddle-ball"></i>
        </div>
      </div>
      <div>
        <h1>ABC Pickleyard</h1>
        <p>Live Court Display</p>
      </div>
    </div>
    <div class="top-nav-right">
      <div class="nav-clock" id="clockTime">00:00:00</div>
      <button class="theme-btn" id="themeToggle" title="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </div>

  <div class="display-wrapper">

    <div class="display-grid">

      <!-- IN PLAY -->
      <div class="display-panel" id="inPlayPanel">
        <h2>
          <span class="dot" id="liveDot"></span>
          IN PLAY
        </h2>
        <div id="courtCard"></div>
      </div>

      <!-- NEXT UP -->
      <div class="display-panel" id="nextUpPanel">
        <h2>NEXT UP</h2>
        <div id="nextGames"></div>
      </div>

    </div>

    <!-- PLAYER OF THE NIGHT -->
    <div class="display-panel potn-panel">
      <h2>🔥PLAYER OF THE NIGHT</h2>
      <div id="top3List"></div>
    </div>

  </div>

  <script src="display.js"></script>
</body>
</html>
